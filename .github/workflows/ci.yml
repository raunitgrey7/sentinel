name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv sync --all-extras
      - name: lint
        run: uv run ruff check backend simulator tests
      - name: typecheck (advisory)
        run: uv run mypy backend/sentinel --ignore-missing-imports || true
      - name: unit + integration + chaos tests
        run: uv run pytest tests/unit tests/integration tests/chaos -q --cov=sentinel --cov-report=xml
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.xml }

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: sentinel, POSTGRES_PASSWORD: sentinel, POSTGRES_DB: sentinel }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sentinel" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      SENTINEL_DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel
      SENTINEL_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv sync --all-extras
      - name: migrate + bootstrap against PostgreSQL
        run: uv run sentinel migrate && uv run sentinel bootstrap
      - name: evaluation smoke (8 scenarios on PostgreSQL)
        run: uv run sentinel eval run --limit 8 --name ci-smoke --report docs/evaluation/ci-smoke.md
      - uses: actions/upload-artifact@v4
        with: { name: eval-smoke, path: docs/evaluation/ci-smoke.md }

  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv sync --all-extras
      - name: full benchmark (deterministic provider)
        run: uv run sentinel eval run --name ci-full --report docs/evaluation/ci-full.md
      - name: enforce quality gate
        run: |
          uv run python - <<'EOF'
          import json
          s = json.load(open("docs/evaluation/latest.json"))["summary"]
          assert s["root_cause_accuracy"] >= 0.85, s["root_cause_accuracy"]
          assert s["false_positive_rate"] <= 0.10, s["false_positive_rate"]
          assert s["citation_validity"] >= 0.95, s["citation_validity"]
          print("quality gate passed", {k: s[k] for k in ("root_cause_accuracy", "false_positive_rate", "citation_validity", "ece")})
          EOF
      - uses: actions/upload-artifact@v4
        with: { name: eval-full, path: docs/evaluation/ci-full.md }

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build backend image
        uses: docker/build-push-action@v6
        with: { context: ., file: infrastructure/docker/Dockerfile.backend, push: false, tags: sentinel/backend:ci }
      - name: build web image
        uses: docker/build-push-action@v6
        with: { context: ./web, file: infrastructure/docker/Dockerfile.web, push: false, tags: sentinel/web:ci }
