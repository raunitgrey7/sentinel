[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel — evidence-driven, local-first AI incident investigation & response platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Raunit Thakur" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "redis>=5.0",
  "arq>=0.26",
  "prometheus-client>=0.20",
  "typer>=0.12",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-exporter-otlp-proto-http>=1.26",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
]

[project.scripts]
sentinel = "sentinel.cli:app"
sentinel-sim = "sentinel_sim.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/sentinel", "simulator/sentinel_sim"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "simulator", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "N", "W", "RUF", "BLE"]
ignore = ["S101", "S104", "S311", "B008", "RUF012", "E501", "N818", "N814", "RUF001", "RUF002", "RUF003", "RUF007", "UP046", "UP047", "UP031", "S105", "S603", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC"]
"simulator/**" = ["S"]
"backend/alembic/**" = ["I001", "W291", "E402", "F401"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
mypy_path = ["backend", "simulator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend", "simulator"]
markers = [
  "integration: requires running infrastructure",
  "e2e: end-to-end through simulator",
  "chaos: chaos scenarios",
  "evaluation: benchmark runs",
]
filterwarnings = ["ignore::DeprecationWarning"]
