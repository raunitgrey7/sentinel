global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Sentinel watches Sentinel
  - job_name: sentinel
    static_configs:
      - targets: ["api:8000"]
        labels: { service: sentinel-api }

  # Demo shop services expose /metrics in Prometheus exposition format
  - job_name: demo-shop
    static_configs:
      - targets: ["simulator:9001"]
        labels: { service: frontend, project: demo-shop }
      - targets: ["simulator:9002"]
        labels: { service: api-gateway, project: demo-shop }
      - targets: ["simulator:9003"]
        labels: { service: auth-service, project: demo-shop }
      - targets: ["simulator:9004"]
        labels: { service: order-service, project: demo-shop }
      - targets: ["simulator:9005"]
        labels: { service: inventory-service, project: demo-shop }
      - targets: ["simulator:9006"]
        labels: { service: payment-service, project: demo-shop }
      - targets: ["simulator:9007"]
        labels: { service: notification-worker, project: demo-shop }
